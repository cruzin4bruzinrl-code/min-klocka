name: Stresstest
on:
  push:
    branches: [stresstest]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Bygg provversion
        run: gradle --no-daemon --console=plain assembleDebug
      - name: Bildverktyg
        run: pip install --quiet pillow || true
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Kör på en emulerad telefon
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 576M
          cores: 4
          disable-animations: false
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none
          script: bash stress/stress.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stresstest
          path: stress-out
      - name: Lägg resultatet på grenen stress-resultat
        if: always()
        run: |
          mogrify -resize 540x stress-out/shots/*.png 2>/dev/null || true
          cd stress-out
          git init -q -b stress-resultat
          git config user.name "stresstest"; git config user.email "stresstest@users.noreply.github.com"
          git add -A && git commit -qm "Stresstest ${GITHUB_RUN_NUMBER}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" stress-resultat
