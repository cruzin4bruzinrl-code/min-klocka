name: Bygg Android-appen
on:
  push:
    branches: [android]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Signeringsnyckel
        env:
          KS_B64: ${{ secrets.KS_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.jks"
            echo "RIKTIG_NYCKEL=ja" >> "$GITHUB_ENV"
          else
            # Utan den riktiga nyckeln byggs appen bara på prov och läggs inte upp
            keytool -genkeypair -keystore "$RUNNER_TEMP/ks.jks" -storepass minklocka -keypass minklocka -alias minklocka -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Provbygge"
            echo "RIKTIG_NYCKEL=nej" >> "$GITHUB_ENV"
          fi
          echo "KS_FILE=$RUNNER_TEMP/ks.jks" >> "$GITHUB_ENV"
          echo "KS_PASS=minklocka" >> "$GITHUB_ENV"
      - name: Bygg
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain assembleRelease 2>&1 | tee build.log
      - name: Lägg upp appen
        if: env.RIKTIG_NYCKEL == 'ja'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk min-klocka.apk
          TITEL="Min klocka för Android, bygge $GITHUB_RUN_NUMBER"
          # Samma utgåva varje gång: filen byts ut. Då finns det aldrig en stund då länken saknas.
          if gh release view app >/dev/null 2>&1; then
            gh release upload app min-klocka.apk --clobber
          else
            gh release create app min-klocka.apk --target android --title "$TITEL" --notes "Installera min-klocka.apk på telefonen."
          fi
          gh release edit app --draft=false --latest --title "$TITEL"
          # Kontroll: utgåvan ska vara publicerad, annars fungerar inte länken
          sleep 3
          test "$(gh release view app --json isDraft -q .isDraft)" = "false"
      - name: Spara felen om bygget gick snett
        if: failure()
        run: |
          git config user.name "bygge"
          git config user.email "bygge@users.noreply.github.com"
          touch build.log
          grep -n -E "error:|FAILED|What went wrong|warning:" -A8 build.log | head -400 > /tmp/fel.txt || true
          tail -120 build.log > /tmp/slut.txt
          git checkout -q --orphan bygglogg
          git rm -rfq . || true
          cp /tmp/fel.txt /tmp/slut.txt .
          git add fel.txt slut.txt
          git commit -qm "Bygglogg för bygge $GITHUB_RUN_NUMBER"
          git push -f origin bygglogg
