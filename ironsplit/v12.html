      <input class="inp" id="s-key" type="password" value="${S.apiKey||''}" placeholder="sk-ant-…" onchange="S.apiKey=this.value.trim();save();toast('Nyckeln är sparad')"></div></div>
    <h2>Dina data</h2>
    <div class="card"><p>Sparat på telefonen: <b>${nDone} styrkepass</b>, <b>${nC} konditionspass</b>, <b>${nW} vägningar</b> och <b>${nM} ${nM===1?'dag':'dagar'}</b> med mat.</p>
      <p class="small" style="margin-top:.3rem">Senaste säkerhetskopia: ${S.lastBackup||'aldrig'}. Ta en kopia en gång i veckan.</p>
      <div class="row" style="margin-top:.8rem"><button class="btn pri" onclick="exportData()">Spara kopia</button><button class="btn sec" onclick="document.getElementById('imp').click()">Läs in kopia</button></div>
      <input type="file" id="imp" accept="application/json,.json" style="display:none" onchange="importData(this.files[0])">
      ${installEvt&&!standalone()?'<button class="btn sec full" style="margin-top:.6rem" onclick="installApp()">📲 Installera på hemskärmen</button>':''}</div>
    <h2>Hjälp</h2>
    <div class="card"><button class="btn sec full" onclick="openGuide()">Visa guiden igen</button>
      <button class="btn sec full danger" style="margin-top:.6rem" onclick="resetAll()">Rensa all data</button></div>`;
}
function setLook(k,v){S[k]=v;save();render()}
function setTrainTime(v){if(!/^\d\d:\d\d$/.test(v))return;S.trainTime=v;TRAIN_TIME=v;save();toast('Träningstiden är '+v);render()}
function setProtein(v){const n=+v;if(!n||n<40||n>300){toast('Ange 40–300 g');render();return}S.protein=n;save();render()}

/* ═════════ GUIDE ═════════ */
const GUIDE=[
 {tab:'today',ic:'👋',t:'Välkommen till nya IronSplit',d:'Appen har fått ett nytt, lättare utseende. All din data finns kvar. Guiden tar en minut.'},
 {tab:'today',ic:'✅',t:'Idag – din lista',d:'Överst står nästa steg med en stor knapp. Under finns dagens lista: väg dig, måltiderna och träningen. Det du har gjort får en grön bock.',hl:1},
 {tab:'week',ic:'🏋️',t:'Träna',d:'Tryck Starta passet. Jag visar en övning i taget, föreslår vikten och räknar ner vilan. Du trycker bara Klart efter varje omgång.',hl:1},
 {tab:'food',ic:'🍽',t:'Mat',d:'Här ser du hur mycket du har kvar att äta idag. Tryck Ätit som planerat, eller Jag åt något annat. Du kan också skanna streckkoden på förpackningar.',hl:1},
 {tab:'prog',ic:'⚖️',t:'Min kropp',d:'Väg dig varje morgon. Kurvan visar hur vikten går, och appen säger om kalorimålet behöver ändras. Här ser du också dina bästa lyft.',hl:1},
 {tab:'settings',ic:'⚙️',t:'Inställningar',d:'Gör texten större, byt till mörkt läge, ändra träningstid och kalorimål. Här sparar du också en säkerhetskopia.',hl:1,top:1},
 {tab:'today',ic:'🚀',t:'Nu kör vi!',d:'Guiden finns under Inställningar om du vill se den igen.'},
];
let gStep=null;
function openGuide(){gStep=0;showGuide()}
function showGuide(){
  const g=GUIDE[gStep];if(g.tab==='settings'){if(tab!=='settings')prevTab=tab;tab='settings'}else tab=g.tab;render();window.scrollTo(0,0);
  const last=gStep===GUIDE.length-1,el=document.getElementById('guide');
  el.innerHTML=`<div class="g-card${g.top?' top':''}" role="dialog" aria-label="Guide"><button class="lnk g-skip" onclick="closeGuide()">Hoppa över</button>
    <div class="g-ic" aria-hidden="true">${g.ic}</div><div class="g-t">${g.t}</div><div class="g-d">${g.d}</div>
    <div class="g-foot"><span class="g-n">${gStep+1} av ${GUIDE.length}</span><div class="g-btns">${gStep>0?'<button class="btn sec" onclick="gStep--;showGuide()">Tillbaka</button>':''}<button class="btn pri" onclick="${last?'closeGuide()':'gStep++;showGuide()'}">${last?'Börja':'Nästa'}</button></div></div></div>`;
  el.classList.add('show');
}
function closeGuide(){gStep=null;S.guideSeen=true;S.uiV=UI_V;save();document.getElementById('guide').classList.remove('show');tab='today';render();window.scrollTo(0,0)}

/* ═════════ ONBOARDING ═════════ */
let OB=null;
const OB_STEPS=['hello','sex','age','h','w','goal','act','time','done'];
function openOnb(first){
  const P=S.profile&&!S.profile.auto?S.profile:{};
  OB={first:!!first,i:0,d:{name:P.name||'',sex:P.sex||'',age:P.age||35,h:P.h||(P.sex==='f'?165:178),w:latestW()||P.w||75,goal:P.goal||'',act:P.act||'',time:S.trainTime||'18:00'}};
  document.getElementById('onb').classList.add('show');obRender();
}
function obSet(k,v,adv){OB.d[k]=v;if(k==='sex'&&!S.profile)OB.d.h=v==='f'?165:178;if(adv)obNext();else obRender()}
function obNum(k,v,min,max){v=Math.round(+v*10)/10;if(isNaN(v))return;OB.d[k]=Math.max(min,Math.min(max,v));obRender()}
function obNext(){
  const st=OB_STEPS[OB.i],d=OB.d;
  if(st==='hello'){d.name=(document.getElementById('ob-name').value||'').trim().slice(0,30)}
  if(st==='sex'&&!d.sex){toast('Välj ett alternativ');return}
  if(st==='goal'&&!d.goal){toast('Välj ett mål');return}
  if(st==='act'&&!d.act){toast('Välj ett alternativ');return}
  if(st==='time'){const v=document.getElementById('ob-time').value;if(/^\d\d:\d\d$/.test(v))d.time=v}
  OB.i=Math.min(OB.i+1,OB_STEPS.length-1);obRender();
}
function obBack(){if(OB.i>0){OB.i--;obRender()}else if(!OB.first)obClose()}
function obClose(){OB=null;document.getElementById('onb').classList.remove('show')}
function obFinish(){
  const d=OB.d,first=OB.first,T=calcTargets(d);
  S.profile={name:d.name,sex:d.sex,age:+d.age,h:+d.h,w:+d.w,goal:d.goal,act:d.act};
  S.budget=T.kcal;S.protein=T.protein;S.trainTime=d.time;TRAIN_TIME=d.time;
  if(first){S.body[today()]=Object.assign(S.body[today()]||{},{w:+d.w});S.start=mondayOf(new Date())}
  save();obClose();tab='today';render();window.scrollTo(0,0);
  if(first&&S.uiV!==UI_V)setTimeout(()=>{gStep=0;showGuide()},350);else toast('Dina mål är uppdaterade');
}
function obStepper(k,unit,step,min,max){
  const v=OB.d[k];
  return `<div class="stepper ob-st"><button aria-label="Minska" onclick="obNum('${k}',${v}-${step},${min},${max})">−</button><div class="st-val"><input type="number" inputmode="decimal" value="${String(v)}" onchange="obNum('${k}',this.value.replace(',','.'),${min},${max})" aria-label="${unit}"><em>${unit}</em></div><button aria-label="Öka" onclick="obNum('${k}',${v}+${step},${min},${max})">+</button></div><p class="small ob-hint">Tryck på siffran för att skriva</p>`;
}
function obChoice(k,opts){
  return `<div class="ob-opts">${opts.map(([v,t,sub])=>`<button class="ob-opt" aria-pressed="${OB.d[k]===v}" onclick="obSet('${k}','${v}',true)"><b>${t}</b>${sub?`<span>${sub}</span>`:''}</button>`).join('')}</div>`;
}
function obRender(){
  const st=OB_STEPS[OB.i],d=OB.d,n=OB_STEPS.length-1;
  let q='',body='',next=true;
  if(st==='hello'){q=OB.first?'Välkommen till IronSplit!':'Dina uppgifter';
    body=`<p class="lead">${OB.first?'Svara på några korta frågor. Då räknar appen ut hur mycket du ska äta och anpassar planen efter dig. Det tar en minut.':'Ändra det som inte stämmer. Kalorier och protein räknas om när du är klar. Dina loggar påverkas inte.'}</p>
      <label class="ob-lbl" for="ob-name">Vad heter du?</label><input class="inp ob-inp" id="ob-name" value="${(d.name||'').replace(/"/g,'&quot;')}" placeholder="Ditt förnamn" autocomplete="given-name" onkeydown="if(event.key==='Enter')obNext()">`}
  if(st==='sex'){q='Är du man eller kvinna?';body=`<p class="lead">Behövs för att räkna ut din förbrukning.</p>`+obChoice('sex',[['m','Man'],['f','Kvinna']]);next=false}
  if(st==='age'){q='Hur gammal är du?';body=obStepper('age','år',1,15,95)}
  if(st==='h'){q='Hur lång är du?';body=obStepper('h','cm',1,120,220)}
  if(st==='w'){q='Vad väger du?';body=`<p class="lead">Ungefär räcker. Du kan väga dig i appen sedan.</p>`+obStepper('w','kg',.5,35,250)}
  if(st==='goal'){q='Vad vill du uppnå?';next=false;body=obChoice('goal',[['lose','Gå ner i vikt','Minska fett och behåll musklerna'],['recomp','Bli starkare och fastare','Bygga muskler och minska fett samtidigt'],['gain','Bygga mer muskler','Gå upp i vikt i lugn takt']])}
  if(st==='act'){q='Hur ser din vardag ut?';next=false;body=`<p class="lead">Utanför träningen.</p>`+obChoice('act',[['low','Jag sitter mest','Kontor, studier, mycket vila'],['mid','Jag rör mig en del','Står och går, promenerar dagligen'],['high','Jag har ett fysiskt jobb','Bygg, vård, lager, mycket på fötterna']])}
  if(st==='time'){q='När brukar du träna?';body=`<p class="lead">Måltiderna före och efter passet läggs runt den här tiden. Du kan ändra den när som helst.</p>
      <div class="seg ob-seg">${['07:00','12:00','17:00','19:00'].map(t=>`<button aria-pressed="${d.time===t}" onclick="OB.d.time='${t}';obRender()">${t}</button>`).join('')}</div>
      <label class="ob-lbl" for="ob-time">Annan tid</label><input class="inp ob-inp" id="ob-time" type="time" value="${d.time}" onchange="OB.d.time=this.value">`}
  if(st==='done'){const T=calcTargets(d);q=(d.name?d.name+', h':'H')+'är är din plan';
    body=`<div class="ob-res"><div><b>${T.kcal}</b><span>kcal per dag</span></div><div><b>${T.protein} g</b><span>protein per dag</span></div></div>
      <p class="lead">Utifrån ${d.age} år, ${d.h} cm och ${kgTxt(d.w)} kg. Målet: ${({lose:'gå ner i vikt',recomp:'bli starkare och fastare',gain:'bygga mer muskler'})[d.goal]}.</p>
      <div class="card ob-card"><p><b>Träning:</b> 4 styrkepass i maskiner och kabel, plus lugn kondition. Träningstid ${d.time}.</p><p style="margin-top:.4rem">Väg dig några morgnar i veckan. Appen säger till om kalorierna behöver justeras. Du kan ändra allt under Inställningar.</p></div>`}
  const last=st==='done';
  document.getElementById('onb').innerHTML=`<div class="ob-in" role="dialog" aria-modal="true" aria-label="Kom igång">
    <div class="ob-top">${OB.i>0||!OB.first?`<button class="lnk ob-back" onclick="obBack()">‹ ${OB.i>0?'Tillbaka':'Stäng'}</button>`:'<span></span>'}<span class="ob-n">${Math.min(OB.i+1,n)} av ${n}</span></div>
    <div class="ob-bar"><i style="width:${Math.round(OB.i/n*100)}%"></i></div>
    <div class="ob-body"><h1 class="ob-q">${q}</h1>${body}</div>
    <div class="ob-foot">${last?`<button class="btn pri big" onclick="obFinish()">${OB.first?'Börja':'Spara'}</button>`:next?`<button class="btn pri big" onclick="obNext()">Nästa</button>`:''}</div></div>`;
  const el=document.querySelector('.ob-body');if(el)el.scrollTop=0;
}

/* ═════════ PWA & START ═════════ */
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{})}
let installEvt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(tab==='settings')render()});
async function installApp(){if(!installEvt)return;installEvt.prompt();await installEvt.userChoice;installEvt=null;render()}
const standalone=()=>matchMedia('(display-mode: standalone)').matches;

save();render();
if(!S.profile){openOnb(true)}
else if(S.uiV!==UI_V){setTimeout(()=>{gStep=0;showGuide()},400)}
else{const C=activeCoach();if(C&&Date.now()-C.started<3*36e5)setTimeout(coOpen,300)}
let lastMin=hhmm(),lastDay=today();
const typing=()=>['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName);
const dlgOpen=()=>document.getElementById('dlg-bg').classList.contains('show')||document.getElementById('sheet-bg').classList.contains('show');
setInterval(()=>{
  const c=document.getElementById('clock'),t=hhmm();if(c)c.textContent=t;
  if(today()!==lastDay){lastDay=today();coachAns='';if(!coIsOpen&&!dlgOpen())render();return}
  if(t!==lastMin){lastMin=t;if((tab==='today'||tab==='food')&&!coIsOpen&&!typing()&&!dlgOpen()&&gStep===null)render()}
},1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!typing()&&!coIsOpen&&!dlgOpen()){lastDay=today();render()}});
window.addEventListener('resize',()=>{if(tab==='prog')drawChart()});

</script>
</body>
</html>
