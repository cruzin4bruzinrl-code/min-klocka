plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Versionen räknas upp av bygget, så att varje ny app går att installera över den förra.
def buildNo = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'se.minklocka.app'
    compileSdk 34
    defaultConfig {
        applicationId 'se.minklocka.app'
        minSdk 31
        targetSdk 34
        versionCode buildNo
        versionName "0.${buildNo}"
    }
    signingConfigs {
        release {
            if (System.getenv('KS_FILE')) {
                storeFile file(System.getenv('KS_FILE'))
                storePassword System.getenv('KS_PASS')
                keyAlias 'minklocka'
                keyPassword System.getenv('KS_PASS')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true }
    lint { abortOnError false; checkReleaseBuilds false }
}

// Riktiga Android-skärmar: Jetpack Compose med Material 3, samma teknik som Googles egna appar
dependencies {
    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.9.2'
}
