plugins { id 'com.android.application' }

// Versionen räknas upp av bygget, så att varje ny app går att installera över den förra.
def buildNo = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'se.minklocka.app'
    compileSdk 34
    defaultConfig {
        applicationId 'se.minklocka.app'
        minSdk 31
        targetSdk 34
        versionCode buildNo
        versionName "0.${buildNo}"
    }
    signingConfigs {
        release {
            if (System.getenv('KS_FILE')) {
                storeFile file(System.getenv('KS_FILE'))
                storePassword System.getenv('KS_PASS')
                keyAlias 'minklocka'
                keyPassword System.getenv('KS_PASS')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false; checkReleaseBuilds false }
}
